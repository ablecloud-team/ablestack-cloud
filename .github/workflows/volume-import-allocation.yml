name: Volume import allocation

on:
  workflow_dispatch:
  push:
    branches: ["codex/issue-87-mold-preallocation"]
  pull_request:
    paths:
      - "api/**"
      - "core/**"
      - "server/**"
      - "engine/**"
      - "plugins/hypervisors/kvm/**"
      - ".github/workflows/volume-import-allocation.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install real image tools
        run: sudo apt-get update && sudo apt-get install -y qemu-utils attr
      - name: Import, lifecycle, legacy and real image contracts
        run: >-
          mvn -B -pl api,core,engine/orchestration,server,plugins/hypervisors/kvm -am
          -Dtest=MigrationDiskControllerPolicyTest,MigrationDiskControllerManagerImplTest,MigrationDiskControllerGuardTest,VolumeAllocationImportTest,VolumeAllocationPolicyTest,VolumeAllocationLifecycleTest,VolumeAllocationCloneTest,Gfs2VolumeImportAllocationTest,Gfs2VolumeAllocationTest,VolumeImportUnmanageManagerImplTest,VolumeAllocationManagerImplTest
          -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Drat.skip=true package
