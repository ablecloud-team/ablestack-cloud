name: ABLESTACK Release

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to release from
        required: true
        default: ablestack-europa
        type: choice
        options:
          - ablestack-europa
          - ablestack-diplo
      release_stage:
        description: Product release stage
        required: true
        default: rc
        type: choice
        options:
          - alpha
          - beta
          - rc
          - ga
      prerelease_number:
        description: Positive sequence for alpha, beta, or rc; leave empty for ga
        required: false
        default: '1'
        type: string
      build_date:
        description: Optional fixed UTC build date in YYYYMMDD format
        required: false
        default: ''
        type: string
      release_seq:
        description: RPM release sequence appended after the timestamp
        required: true
        default: '1'
        type: string
      pack:
        description: Package variant
        required: false
        default: noredist
        type: choice
        options:
          - noredist
          - oss
      simulator:
        description: Include simulator packaging
        required: false
        default: default
        type: choice
        options:
          - default
          - simulator
      node_version:
        description: Node.js version injected into the Rocky build container
        required: false
        default: 14.21.3
        type: string
      push_refs:
        description: Push the generated RC branch and release tag back to origin
        required: false
        default: true
        type: boolean
      sign_artifacts:
        description: Sign the source tarball with the configured GPG key
        required: false
        default: false
        type: boolean
      sign_tag:
        description: Create a signed git tag with the configured GPG key
        required: false
        default: false
        type: boolean
      draft:
        description: Create the GitHub Release as a draft
        required: false
        default: true
        type: boolean
concurrency:
  group: release-${{ inputs.base_branch }}-${{ inputs.release_stage }}-${{ inputs.prerelease_number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      brand: ${{ steps.derive.outputs.brand }}
      display_version: ${{ steps.product.outputs.display_version }}
      release_id: ${{ steps.product.outputs.release_tag }}
      release_name: ${{ steps.product.outputs.release_name }}
      is_prerelease: ${{ steps.product.outputs.is_prerelease }}
      package_version: ${{ steps.derive.outputs.package_version }}
      timestamp_value: ${{ steps.derive.outputs.timestamp_value }}
      metadata_artifact_name: ${{ steps.derive.outputs.metadata_artifact_name }}
      source_artifact_name: ${{ steps.derive.outputs.source_artifact_name }}
      rpm_artifact_name: ${{ steps.derive.outputs.rpm_artifact_name }}
      systemvm_artifact_name: ${{ steps.derive.outputs.systemvm_artifact_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - id: product
        name: Generate product release metadata
        run: |
          python3 tools/build/release_metadata.py \
            --base-branch "${{ inputs.base_branch }}" \
            --stage "${{ inputs.release_stage }}" \
            --number "${{ inputs.prerelease_number }}" \
            --build-date "${{ inputs.build_date }}" \
            --git-commit "$(git rev-parse HEAD)" \
            --workflow-run-id "${{ github.run_id }}" \
            --output dist/release/release-metadata.json \
            --github-output "$GITHUB_OUTPUT"

      - id: derive
        run: |
          pom_version=$(awk '
            /<artifactId>cloudstack<\/artifactId>/ { seen=1; next }
            seen && /<version>/ {
              line=$0
              sub(/.*<version>/, "", line)
              sub(/<\/version>.*/, "", line)
              print line
              exit
            }
          ' pom.xml)

          if [ -z "$pom_version" ]; then
            echo "::error::Unable to derive root project version from pom.xml"
            exit 1
          fi

          package_version=${pom_version%%-*}
          timestamp_value=$(date -u +%Y%m%d%H%M)

          {
            echo "brand=${{ steps.product.outputs.brand }}"
            echo "package_version=$package_version"
            echo "timestamp_value=$timestamp_value"
            echo "metadata_artifact_name=release-metadata-${{ github.run_id }}"
            echo "source_artifact_name=source-release-${{ steps.product.outputs.artifact_version }}"
            echo "rpm_artifact_name=rocky97-rpm-${{ steps.product.outputs.artifact_version }}"
            echo "systemvm_artifact_name=systemvm-kvm-${{ steps.product.outputs.artifact_version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.derive.outputs.metadata_artifact_name }}
          if-no-files-found: error
          path: dist/release/release-metadata.json

  prepare-source-release:
    needs: metadata
    runs-on: ubuntu-24.04
    outputs:
      rc_branch: ${{ steps.prepare.outputs.rc_branch }}
      source_commit_sha: ${{ steps.prepare.outputs.source_commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate signing configuration
        run: |
          if [ "${{ inputs.sign_tag }}" = "true" ] && [ "${{ inputs.push_refs }}" != "true" ]; then
            echo "::error::sign_tag requires push_refs=true so the signed tag reaches origin"
            exit 1
          fi

          if [ "${{ inputs.sign_artifacts || inputs.sign_tag }}" = "true" ] && [ -z "${{ secrets.RELEASE_GPG_PRIVATE_KEY }}" ]; then
            echo "::error::sign_artifacts/sign_tag was requested but RELEASE_GPG_PRIVATE_KEY is not configured"
            exit 1
          fi

      - name: Import release GPG key
        if: ${{ inputs.sign_artifacts || inputs.sign_tag }}
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$RELEASE_GPG_PASSPHRASE" ]; then
            echo allow-loopback-pinentry > "$GNUPGHOME/gpg-agent.conf"
            gpgconf --kill gpg-agent || true
            printf '%s\n' '#!/usr/bin/env bash' "exec gpg --batch --pinentry-mode loopback --passphrase \"$RELEASE_GPG_PASSPHRASE\" \"\$@\"" > "$RUNNER_TEMP/gpg-loopback.sh"
            chmod +x "$RUNNER_TEMP/gpg-loopback.sh"
            git config gpg.program "$RUNNER_TEMP/gpg-loopback.sh"
          fi
          if [ -n "$RELEASE_GPG_KEY_ID" ]; then
            git config user.signingkey "$RELEASE_GPG_KEY_ID"
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - id: prepare
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          args=(
            --release-id "${{ needs.metadata.outputs.release_id }}"
            --branch "${{ inputs.base_branch }}"
            --outputdir "$GITHUB_WORKSPACE/dist/release/source"
            --timestamp "${{ needs.metadata.outputs.timestamp_value }}"
            --archive-prefix "ablestack-cloud"
            --tag
          )

          if [ "${{ inputs.sign_artifacts }}" = "true" ]; then
            args+=(--sign-artifacts)
          fi

          if [ "${{ inputs.sign_tag }}" = "true" ]; then
            args+=(--sign-tag)
          fi

          if [ -n "${{ secrets.RELEASE_GPG_KEY_ID }}" ]; then
            args+=(--gpg-key-id "${{ secrets.RELEASE_GPG_KEY_ID }}")
          fi

          ./tools/build/prepare_ablestack_source_release.sh "${args[@]}"

      - name: Push RC branch and release tag
        if: ${{ inputs.push_refs }}
        run: |
          git push origin "${{ steps.prepare.outputs.rc_branch }}"
          git push origin "refs/tags/${{ needs.metadata.outputs.release_id }}"

      - name: Upload source release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.source_artifact_name }}
          if-no-files-found: error
          path: dist/release/source/**

  validate-build:
    needs: prepare-source-release
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare-source-release.outputs.source_commit_sha }}

  validate-ui:
    needs: prepare-source-release
    uses: ./.github/workflows/ui.yml
    with:
      ref: ${{ needs.prepare-source-release.outputs.source_commit_sha }}

  build-rpm:
    needs:
      - metadata
      - prepare-source-release
      - validate-build
      - validate-ui
      - build-systemvm-kvm
    uses: ./.github/workflows/rocky97-rpm.yml
    with:
      ref: ${{ needs.prepare-source-release.outputs.source_commit_sha }}
      pack: ${{ inputs.pack }}
      simulator: ${{ inputs.simulator }}
      release: ${{ inputs.release_seq }}
      brand: ${{ needs.metadata.outputs.brand }}
      package_version: ${{ needs.metadata.outputs.package_version }}
      ui_build_version: ${{ needs.metadata.outputs.display_version }}
      use_timestamp: true
      timestamp_value: ${{ needs.metadata.outputs.timestamp_value }}
      build_srpm: true
      templates: kvm
      node_version: ${{ inputs.node_version }}
      artifact_name: ${{ needs.metadata.outputs.rpm_artifact_name }}
      storage_runtime_public_key_artifact: ${{ needs.metadata.outputs.systemvm_artifact_name }}
      storage_runtime_signing_key_id: ablestack-runtime-release

  build-systemvm-kvm:
    needs:
      - metadata
      - prepare-source-release
      - validate-build
    uses: ./.github/workflows/systemvm-kvm.yml
    secrets: inherit
    with:
      require_stable_runtime_signing_key: true
      ref: ${{ needs.prepare-source-release.outputs.source_commit_sha }}
      version: ${{ needs.metadata.outputs.package_version }}
      build_number: ${{ github.run_number }}
      artifact_name: ${{ needs.metadata.outputs.systemvm_artifact_name }}
      release_display_version: ${{ needs.metadata.outputs.display_version }}

  publish-release:
    needs:
      - metadata
      - prepare-source-release
      - build-rpm
      - build-systemvm-kvm
    runs-on: ubuntu-24.04
    steps:
      - name: Download source release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.source_artifact_name }}
          path: download/source

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.metadata_artifact_name }}
          path: download/metadata

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.rpm_artifact_name }}
          path: download/rpm

      - name: Download KVM System VM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.systemvm_artifact_name }}
          path: download/systemvm

      - name: Assemble GitHub Release assets
        run: |
          mkdir -p release-assets
          find download/source -type f -exec cp {} release-assets/ \;
          find download/metadata -type f -exec cp {} release-assets/ \;
          find download/rpm -type f -exec cp {} release-assets/ \;
          find download/systemvm -type f \
            \( -name '*.qcow2.bz2' -o -name 'SYSTEMVM-*' \
               -o -name 'ablestack-storage-runtime-*' -o -name 'ablestack-runtime-*.pem' \) \
            -exec cp {} release-assets/ \;
          (
            cd release-assets
            rm -f SHA256SUMS
            checksum_file=$(mktemp)
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > "$checksum_file"
            mv "$checksum_file" SHA256SUMS
          )

      - name: Summarize release contents
        run: |
          systemvm_image=$(find release-assets -maxdepth 1 -type f -name '*.qcow2.bz2' -printf '%f\n')
          {
            echo "## ABLESTACK Release"
            echo
            echo "- Release: \`${{ needs.metadata.outputs.release_name }}\`"
            echo "- Source commit: \`${{ needs.prepare-source-release.outputs.source_commit_sha }}\`"
            echo "- Package mode: \`${{ inputs.pack }}\`"
            echo "- System VM hypervisor: \`KVM\`"
            echo "- System VM architecture: \`x86_64\`"
            echo "- System VM format: \`qcow2.bz2\`"
            echo "- System VM image: \`$systemvm_image\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_id }}
          target_commitish: ${{ needs.prepare-source-release.outputs.source_commit_sha }}
          name: ${{ needs.metadata.outputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ needs.metadata.outputs.is_prerelease }}
          generate_release_notes: false
          files: release-assets/*
