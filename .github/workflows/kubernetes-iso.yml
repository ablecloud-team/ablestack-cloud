name: Mold Kubernetes ISO
on:
  push:
    branches: [codex/kubernetes-iso-1228]
    paths: ['scripts/util/kubernetes-iso/**', 'scripts/util/create-kubernetes-binaries-iso.sh', '.github/workflows/kubernetes-iso.yml']
    tags: ['k8s-v*-mold-cks-amd64-r*']
  pull_request:
    paths: ['scripts/util/kubernetes-iso/**', 'scripts/util/create-kubernetes-binaries-iso.sh', '.github/workflows/kubernetes-iso.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Exact Kubernetes patch version in the checked-in recipe
        required: true
        type: choice
        options: ['1.34.2', '1.34.9', '1.34.12', '1.35.9', '1.36.5', '1.37.1']
      revision:
        description: Immutable artifact revision (r1, r2, ...)
        type: string
        default: r1
      publish:
        description: Publish only to Origin trial Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mold-kubernetes-iso-${{ github.ref }}
  cancel-in-progress: false
jobs:
  iso:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || github.repository == 'ablecloud-team/ablestack-cloud'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.34.2', '1.34.9', '1.34.12', '1.35.9', '1.36.5', '1.37.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install independent ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo xorriso python3-yaml
          sudo install -d -m 0711 /run/containerd
          scripts/util/kubernetes-iso/setup-tools.sh "$RUNNER_TEMP/mold-iso-tools"
          echo "$RUNNER_TEMP/mold-iso-tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/mold-iso-tools/bin" >> "$GITHUB_PATH"
      - name: Recipe and rejection tests
        run: python3 -m unittest discover -s scripts/util/kubernetes-iso/tests -v
      - name: Build and independently validate ISO
        if: (github.event_name != 'workflow_dispatch' || inputs.version == matrix.version) && (!startsWith(github.ref, 'refs/tags/') || startsWith(github.ref_name, format('k8s-v{0}-', matrix.version)))
        env:
          VERSION: ${{ matrix.version }}
          REVISION: ${{ inputs.revision || 'r1' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REVISION=$(echo "$GITHUB_REF_NAME" | sed -nE 's/^k8s-v[0-9.]+-mold-cks-amd64-(r[0-9]+)-[a-f0-9]{8}$/\1/p')
            [ -n "$REVISION" ] || exit 1
          fi
          scripts/util/create-kubernetes-binaries-iso.sh --recipe "scripts/util/kubernetes-iso/recipes/kubernetes-$VERSION-amd64.json" --output "$RUNNER_TEMP/iso-output" --revision "$REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.version == matrix.version) && (!startsWith(github.ref, 'refs/tags/') || startsWith(github.ref_name, format('k8s-v{0}-', matrix.version)))
        with:
          name: kubernetes-${{ matrix.version }}-amd64
          path: ${{ runner.temp }}/iso-output/
          compression-level: 0
          retention-days: 7
  publish:
    needs: iso
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ['1.34.2', '1.34.9', '1.34.12', '1.35.9', '1.36.5', '1.37.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: (github.event_name != 'workflow_dispatch' || inputs.version == matrix.version) && (!startsWith(github.ref, 'refs/tags/') || startsWith(github.ref_name, format('k8s-v{0}-', matrix.version)))
        with:
          name: kubernetes-${{ matrix.version }}-amd64
          path: ${{ runner.temp }}/iso-output/
      - name: Publish immutable Origin trial
        if: github.repository == 'dhslove/ablestack-cloud' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && (github.event_name != 'workflow_dispatch' || inputs.version == matrix.version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/util/kubernetes-iso/publish.py --directory "$RUNNER_TEMP/iso-output" --repository dhslove/ablestack-cloud --mode origin-trial
      - name: Publish official tag after Europa merge
        if: github.repository == 'ablecloud-team/ablestack-cloud' && startsWith(github.ref_name, format('k8s-v{0}-', matrix.version))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          NAME=$(basename "$RUNNER_TEMP/iso-output/"*.iso .iso)
          TAG=${NAME/kubernetes-/k8s-}
          if [ "$GITHUB_REF_NAME" = "$TAG" ]; then
            git remote add upstream https://github.com/ablecloud-team/ablestack-cloud.git
            python3 scripts/util/kubernetes-iso/publish.py --directory "$RUNNER_TEMP/iso-output" --repository ablecloud-team/ablestack-cloud --mode official
          fi
