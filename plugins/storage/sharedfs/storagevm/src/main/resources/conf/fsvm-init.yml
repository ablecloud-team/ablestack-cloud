---
write_files:
  - path: /usr/local/bin/sharedfs/common
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash -e

      LOG_FILE="/var/log/userdata.log"
      log() {
        echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" >> $LOG_FILE
      }
      get_block_device() {
        if [ "$HYPERVISOR" == "kvm" ]; then
          BLOCK_DEVICE="sdb"
          if [ -n "$(blkid /dev/$BLOCK_DEVICE)" -a -z "$(blkid -s TYPE /dev/$BLOCK_DEVICE)" ]; then
            BLOCK_DEVICE="sda"
          fi
        elif [ "$HYPERVISOR" == "xenserver" ]; then
          BLOCK_DEVICE="xvdb"
          if [ -n "$(blkid /dev/$BLOCK_DEVICE)" -a -z "$(blkid -s TYPE /dev/$BLOCK_DEVICE)" ]; then
            BLOCK_DEVICE="xvda"
          fi
        elif [ "$HYPERVISOR" == "vmware" ]; then
          BLOCK_DEVICE="sdb"
          if [ -n "$(blkid /dev/$BLOCK_DEVICE)" -a -z "$(blkid -s TYPE /dev/$BLOCK_DEVICE)" ]; then
            BLOCK_DEVICE="sda"
          fi
        else
          log "Unknown hypervisor"
          exit 1
        fi
        echo "$BLOCK_DEVICE"
      }

  - path: /usr/local/bin/sharedfs/create-shared-filesystem
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash -e

      source /usr/local/bin/sharedfs/common

      log "Skipping legacy SharedFS data disk mount. Storage Service QGA commands prepare backing volumes and exports."

  - path: /usr/local/bin/sharedfs/resize-filesystem
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash -e

      source /usr/local/bin/sharedfs/common
      log "Skipping legacy SharedFS resize. Storage Service QGA commands resize backing volumes and filesystems."

  - path: /etc/systemd/system/resize-sharedfs@.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Resize Shared FileSystem

      [Install]
      WantedBy=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/sharedfs/resize-filesystem %I

  - path: /etc/systemd/system/cloud-dhclient@.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=ABLESTACK DHCP client for %i
      After=network-pre.target
      Wants=network-pre.target

      [Install]
      WantedBy=multi-user.target

      [Service]
      Type=simple
      ExecStartPre=/bin/mkdir -p /var/lib/dhcp
      ExecStartPre=/bin/sh -c '/usr/sbin/dhclient -x -pf /run/dhclient.%i.pid %i 2>/dev/null || true'
      ExecStart=/usr/sbin/dhclient -4 -d -v -pf /run/dhclient.%i.pid -lf /var/lib/dhcp/dhclient.%i.leases %i
      ExecStop=/usr/sbin/dhclient -x -pf /run/dhclient.%i.pid %i
      Restart=always
      RestartSec=5

  - path: /usr/local/bin/sharedfs/configure-network-ownership
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash -e

      source /usr/local/bin/sharedfs/common

      primary_interface="${1:-eth0}"
      for attempt in $(seq 1 30); do
        if ip -4 -o addr show dev "$primary_interface" scope global | grep -q ' inet '; then
          break
        fi
        sleep 1
      done
      if ! ip -4 -o addr show dev "$primary_interface" scope global | grep -q ' inet '; then
        log "Persistent DHCP did not configure a global IPv4 on $primary_interface"
        exit 1
      fi

      cat > /etc/network/interfaces <<'EOF'
      # Managed by ABLESTACK Storage Service. NICs are owned by cloud-dhclient@.service.
      auto lo
      iface lo inet loopback
      EOF
      systemctl disable networking.service >/dev/null 2>&1 || true
      systemctl reset-failed networking.service >/dev/null 2>&1 || true
      log "Persistent DHCP owns Storage Service NICs; legacy networking.service disabled"

  - path: /usr/local/bin/sharedfs/fsvm-setup
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash -e

      source /usr/local/bin/sharedfs/common

      for interface in $(ls /sys/class/net/ | grep '^eth'); do
        echo "Starting persistent cloud-dhclient service for interface: $interface"
        sudo systemctl enable --now cloud-dhclient@$interface.service
      done
      log "Existing network interfaces configured"

      /usr/local/bin/sharedfs/configure-network-ownership eth0

      UDEV_ADD_NIC_RULE="ACTION==\"add\", SUBSYSTEM==\"net\", DRIVERS==\"?*\", ENV{SYSTEMD_WANTS}=\"cloud-dhclient@%k.service\""

      # Add udev rules
      echo "$UDEV_ADD_NIC_RULE" > /etc/udev/rules.d/99-add-nic.rules

      log "Udev rules added."

      # Reload udev rules
      udevadm control --reload-rules
      udevadm trigger

      log "Script execution finished successfully."

      sudo touch /home/cloud/success
      echo "true" > /home/cloud/success

runcmd:
  - /usr/local/bin/sharedfs/fsvm-setup
