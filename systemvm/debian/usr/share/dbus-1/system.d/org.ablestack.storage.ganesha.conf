<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own_prefix="org.ablestack.storage.ganesha"/>
    <allow send_destination_prefix="org.ablestack.storage.ganesha"/>
  </policy>
  <policy context="default">
    <deny own_prefix="org.ablestack.storage.ganesha"/>
    <deny send_destination_prefix="org.ablestack.storage.ganesha"/>
  </policy>
</busconfig>
