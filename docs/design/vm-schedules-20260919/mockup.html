<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){let state=$('state').value,q=$('search').value.toLowerCase(),a=items.filter(x=>(x.desc+x.action).toLowerCase().includes(q));$('stale').innerHTML=state==='error'?'<div class="notice" role="alert">스케줄을 불러오지 못했습니다. 마지막 조회 결과를 표시합니다. <button onclick="retry()">다시 시도</button></div>':'';if(state==='empty')a=[];$('count').textContent=`전체 ${a.length}개`;$('rows').innerHTML=state==='loading'?'<tr><td colspan="6" class="empty" role="status">스케줄을 불러오는 중입니다…</td></tr>':a.length?a.map(x=>`<tr><td>${esc(x.desc)}<small>생성일 · 2026. 9. 19.</small></td><td><span class="badge ${x.enabled?'':'off'}">${x.enabled?'● 활성':'○ 비활성'}</span></td><td>${x.action}</td><td>${esc(x.human)}<small>${esc(x.tz)}</small></td><td>${esc(x.start.replace('T',' '))}<small>${x.end?esc(x.end.replace('T',' '))+' 종료':'종료일 없음'}</small></td><td><div class="rowactions"><button onclick="openDialog('edit',${x.id})">편집</button><details ontoggle="positionMenu(this)"><summary aria-label="${esc(x.desc)} 작업">작업 ▾</summary><div class="menu"><button onclick="openDialog('toggle',${x.id})">${x.enabled?'비활성화':'활성화'}</button><button class="danger" onclick="openDialog('delete',${x.id})">삭제</button><hr><button onclick="openDialog('detail',${x.id})">상세</button></div></details></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">'+(q?'검색 결과가 없습니다.':'등록된 스케줄이 없습니다.<br>스케줄 추가 버튼으로 VM의 반복 작업을 예약하세요.')+'</td></tr>'}

if(m==='add'||m==='edit'){$('body').innerHTML=`<div class="notice"><strong>가상머신</strong> · W2025-GFS2-Sparse</div><div class="field"><label for="desc">설명</label><input id="desc" maxlength="255" value="${esc(x.desc)}" placeholder="예: 평일 업무 시작"><p class="help">목록에서 구분할 수 있는 설명을 입력하세요.</p></div><div class="field"><label for="action">동작 <span class="required">*</span></label><select id="action" ${m==='edit'?'disabled':''}>${['시작','정지','재시작','강제 정지','강제 재시작'].map(a=>`<option ${a===x.action?'selected':''}>${a}</option>`).join('')}</select><p class="help">${m==='edit'?'생성된 스케줄의 동작은 변경할 수 없습니다.':'예약한 시각에 선택한 VM 작업을 수행합니다.'}</p><div id="force" class="notice danger" hidden>강제 작업은 게스트 OS의 정상 종료 절차를 생략하여 데이터가 손실될 수 있습니다.</div></div><div class="field"><label for="tz">시간대 <span class="required">*</span></label><select id="tz"><option>Asia/Seoul</option><option>UTC</option><option>America/New_York</option></select><p class="help">아래 날짜와 반복 시각은 선택한 시간대 기준입니다.</p></div><div class="grid"><div class="field"><label for="start">시작 일시</label><input id="start" type="datetime-local" value="${x.start}"></div><div class="field"><label for="end">종료 일시 (선택)</label><input id="end" type="datetime-local" value="${x.end}"><p class="help">비워 두면 종료일 없이 반복합니다.</p></div></div><div class="field"><label for="format">일정 입력 방식</label><select id="format"><option value="basic">간편 설정</option><option value="cron">Cron 직접 입력</option></select></div><div id="basic" class="grid"><div class="field"><label for="repeat">반복</label><select id="repeat"><option>평일 (월–금)</option><option>매일</option><option>매주 일요일</option></select></div><div class="field"><label for="time">실행 시각</label><input id="time" type="time" value="${x.id===2?'19:00':x.id===3?'03:00':'09:00'}"></div></div><div class="field" id="cronfield" hidden><label for="cron">Cron 표현식 <span class="required">*</span></label><input id="cron" value="${esc(x.cron)}" placeholder="0 9 * * 1-5"><p class="help">분 · 시 · 일 · 월 · 요일의 5개 항목을 입력합니다. 예: 0 9 * * 1-5</p></div><div class="notice" id="preview">매주 월–금 · 09:00 · Asia/Seoul</div><div class="field"><label class="check"><input id="enabled" type="checkbox" ${x.enabled?'checked':''}> 스케줄 활성화</label><p class="help">비활성 상태에서는 예약 작업을 실행하지 않습니다.</p></div><div id="validation" class="error" role="alert"></div>`;$('tz').value=x.tz;if(m==='edit')$('format').value='cron';$('repeat').selectedIndex=x.id===3?2:0;['repeat','time','tz','format','cron','action'].forEach(k=>$(k).onchange=preview);preview();}
else if(m==='detail')$('body').innerHTML=`<dl class="detailgrid"><dt>설명</dt><dd>${esc(x.desc)}</dd><dt>가상머신</dt><dd>W2025-GFS2-Sparse</dd><dt>상태</dt><dd>${x.enabled?'활성':'비활성'}</dd><dt>동작</dt><dd>${x.action}</dd><dt>반복 일정</dt><dd>${esc(x.human)}</dd><dt>Cron 표현식</dt><dd><code>${esc(x.cron)}</code></dd><dt>시간대</dt><dd>${esc(x.tz)}</dd><dt>시작 일시</dt><dd>${esc(x.start.replace('T',' '))}</dd><dt>종료 일시</dt><dd>${x.end?esc(x.end.replace('T',' ')):'없음'}</dd><dt>생성일</dt><dd>2026. 9. 19.</dd></dl>`;

document.body.style.overflow='hidden';$('overlay').hidden=false;$('body').scrollTop=0;setTimeout(()=>($('desc')||$('cancel')).focus(),0)}
function preview(){const raw=$('format').value==='cron';$('basic').hidden=raw;$('cronfield').hidden=!raw;let days=['1-5','*','0'][$('repeat').selectedIndex],parts=$('time').value.split(':');if(!raw)$('cron').value=`${Number(parts[1])} ${Number(parts[0])} * * ${days}`;$('preview').textContent=raw?'입력한 일정: '+$('cron').value+' · '+$('tz').value:$('repeat').value+' · '+$('time').value+' · '+$('tz').value;$('force').hidden=!$('action').value.startsWith('강제')}

$('cancel').onclick=$('close').onclick=closeDialog;$('add').onclick=()=>openDialog('add');$('theme').onclick=()=>{let light=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=light?'light':'dark';$('theme').textContent=light?'다크모드 보기':'라이트모드 보기'};$('refresh').onclick=$('update').onclick=retry;$('state').onchange=$('search').oninput=render;$('reset').onclick=()=>{items=defaults();$('state').value='list';$('search').value='';render()};document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')closeDialog();if(e.key==='Tab'){let a=[...$('overlay').querySelectorAll('button,input,select')].filter(x=>!x.disabled&&x.offsetParent!==null),f=a[0],l=a[a.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});items=defaults();render();
