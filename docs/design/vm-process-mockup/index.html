function inventory(){
 const rows=iswin?[[4,'System','SYSTEM','실행 중','—','—','보호 대상'],[864,'svchost.exe','SYSTEM','실행 중','42.6 MB','W32Time','Windows 미지원'],[2812,'DemoWorker.exe','demo','실행 중','18.4 MB','—','Windows 미지원'],[3940,'DemoService.exe','SYSTEM','실행 중','26.8 MB','DemoService','Windows 미지원']]:[[1,'systemd','root','대기','12.4 MB','—','보호 대상'],[924,'qemu-ga','root','대기','8.2 MB','qemu-guest-agent','보호 대상'],[1832,'nginx','www-data','대기','24.6 MB','nginx.service',''],[2408,'worker','app','실행 중','68.2 MB','—',''],[2516,'postgres','postgres','대기','96.1 MB','postgresql.service',''],[2680,'cron','root','대기','4.0 MB','cron.service','']];

function content(){

 if(expired)out+=alert('목록이 오래되어 변경 작업을 사용할 수 없습니다.','10초가 지난 목록입니다. 새로고침 후 대상을 다시 선택하세요.','warning',btn('새로고침'));
 if(busy)out+=alert('작업 결과를 아직 확인할 수 없습니다.','같은 작업을 다시 실행하지 않습니다. 결과를 확인하는 동안 이 VM의 변경 작업은 잠깁니다.','warning')+`<div class="operation"><div class="operation-head"><strong>worker · PID 2408 · 강제 종료</strong><span class="tag warn">결과 미확정 · UNKNOWN</span></div><div class="small secondary">요청 시각 14:31:52 · 응답을 받지 못함 · 실행되었을 수 있음</div><div class="small secondary" style="margin:8px 0 12px">작업 ID <span class="mono">op-demo-7c42…90e1</span>　<a href="#">자세히 보기</a></div>${btn('↻ 작업 결과 확인')} <span class="small secondary">조회만 수행하며 종료 명령은 재전송하지 않습니다.</span></div>`;

 if(iswin)out+=alert('Windows에서는 정상 종료를 지원하지 않습니다.','강제 종료와 연결된 서비스 재시작을 사용할 수 있습니다. 일반 프로세스 자체의 재시작은 지원하지 않습니다.');

function modal(){if(!['terminate','kill','restart'].includes(state))return '';
 const kill=state==='kill',restart=state==='restart';const title=kill?'프로세스 강제 종료':restart?'서비스 재시작':'프로세스 종료';
