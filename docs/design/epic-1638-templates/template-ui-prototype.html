<script>
(() => {
  const root = document.getElementById('mold-template-preview')
  const screen = root.querySelector('#mp-screen')
  const dialog = root.querySelector('#mp-dialog')
  const form = root.querySelector('#mp-form')
  const modalBody = root.querySelector('#mp-dialog-body')
  const submit = root.querySelector('#mp-submit')
  const feedback = root.querySelector('#mp-feedback')
  const checksum = 'db0fb0265046dadb77d98e6a5149e3bfda6a2aea2c16e1644d3ea4ccd99fa168cf50ecd70536b1ef1099043ed1e25f3bdc742d1950b9fca394b9af91e736d909'
  const rows = [
    { id:'11111111-1111-4111-8111-111111111111', name:'Rocky Linux 9 기본 이미지', type:'USER', os:'Rocky Linux 9', state:'ready', arch:'x86_64', format:'QCOW2', size:'100 GiB', ssh:true, hvm:true, cks:false, description:'서버 배포용 검증 이미지', zones:[{name:'13-Zone',state:'ready',raw:'DOWNLOADED',detail:'다운로드 완료',storage:'Primary Storage'}] },
    { id:'22222222-2222-4222-8222-222222222222', name:'Ubuntu 24.04 가져오기', type:'USER', os:'Ubuntu 24.04 (64-bit)', state:'error', arch:'x86_64', format:'QCOW2', size:'—', ssh:true, hvm:true, cks:false, description:'다운로드 원인 확인이 필요한 이미지', zones:[{name:'13-Zone',state:'error',raw:'DOWNLOAD_ERROR',detail:'Connection refused',storage:'Secondary Storage'}] },
    { id:'33333333-3333-4333-8333-333333333333', name:'Windows Server 2025 이미지', type:'USER', os:'Windows Server 2025 (64-bit)', state:'progress', arch:'x86_64', format:'QCOW2', size:'100 GiB', ssh:false, hvm:true, cks:false, description:'이미지 전송 중', zones:[{name:'13-Zone',state:'progress',raw:'DOWNLOAD_IN_PROGRESS',detail:'다운로드 중 · 64%',storage:'Secondary Storage'}] },
    { id:'44444444-4444-4444-8444-444444444444', name:'VNF 네트워크 어플라이언스', type:'VNF', os:'Other Linux (64-bit)', state:'ready', arch:'x86_64', format:'QCOW2', size:'8 GiB', ssh:true, hvm:true, cks:false, description:'네트워크 서비스용 이미지', zones:[{name:'13-Zone',state:'ready',raw:'DOWNLOADED',detail:'다운로드 완료',storage:'Primary Storage'}] }
  ]
  const vm = { view:'list', selected:rows[0].id, tab:'details', query:'', ready:'all', hypervisor:'all', cks:'all', userdata:'all', appearance:'auto', mode:'', busy:false, source:'url', nic:{deviceid:0,name:'management',required:true,management:true}, vnf:{VERSION:'1.0'}, comments:{}, prepared:false }
  let nextMockId = 5
  let trigger = null
  let selectedZones = []
  const text = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  const current = () => rows.find(r => r.id === vm.selected) || rows[0]
  const labels = {ready:'사용 가능',error:'다운로드 실패',progress:'다운로드 중',unknown:'상태 확인 필요',partial:'일부 Zone 사용 가능'}
  const status = state => '<span class="mp-status" data-state="'+state+'">'+labels[state]+'</span>'
  const flag = value => value ? '예' : '아니오'
  const field = (label,value) => '<div><dt>'+label+'</dt><dd>'+value+'</dd></div>'
  const say = message => { feedback.textContent = message }
  const save = () => {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{view:vm.view,tab:vm.tab,appearance:vm.appearance},privateContent:{selected:vm.selected,query:vm.query,ready:vm.ready}}).catch(()=>{})
  }
  function applyAppearance(){ root.style.colorScheme = vm.appearance === 'auto' ? 'inherit' : vm.appearance }
  function render(){
    applyAppearance()
    root.querySelector('#mp-crumb-name').textContent = vm.view === 'detail' ? '/ '+current().name : ''
    root.querySelector('#mp-page-actions').innerHTML = vm.view === 'list' ? '<button class="mp-primary" type="button" data-dialog="register">＋ URL로 템플릿 등록</button><button type="button" data-dialog="upload">로컬 업로드</button>' : '<button type="button" data-dialog="edit" '+(current().state==='ready'?'':'disabled')+'>템플릿 편집</button>'
    if(vm.view === 'list') renderList(); else renderDetail()
    if(window.lucide) window.lucide.createIcons({attrs:{width:18,height:18}})
  }
  function renderList(){
    let result = rows.filter(r => r.name.toLowerCase().includes(vm.query.toLowerCase()) && (vm.ready==='all'||(r.state==='ready')===(vm.ready==='true')) && (vm.cks==='all'||r.cks===(vm.cks==='true')) && (vm.userdata==='all'||(vm.userdata==='none'?r.id!=='11111111-1111-4111-8111-111111111111':r.id==='11111111-1111-4111-8111-111111111111')))
    screen.innerHTML = '<div class="mp-toolbar"><label>준비 여부 <select id="mp-ready"><option value="all">모두</option><option value="true">사용 가능</option><option value="false">준비되지 않음</option></select></label><button type="button" data-dialog="search">고급 검색</button><form class="mp-search" id="mp-search-form" role="search"><input aria-label="템플릿 검색" placeholder="이름 키워드 검색" value="'+text(vm.query)+'"><button type="submit">검색</button></form></div><section class="mp-surface" aria-label="템플릿 목록"><div class="mp-table-wrap"><table class="mp-list-table"><thead><tr><th>이름</th><th>상태</th><th>OS 유형</th><th>아키텍처</th><th>형식 / 유형</th></tr></thead><tbody>'+result.map(r=>'<tr><td><button class="mp-link" type="button" data-open="'+r.id+'">'+text(r.name)+'</button></td><td>'+status(r.state)+(r.state==='error'?'<div class="mp-sub">Connection refused</div>':'')+'</td><td>'+text(r.os)+'</td><td>'+r.arch+'</td><td>'+r.format+' <span class="mp-type">'+r.type+'</span></td></tr>').join('')+'</tbody></table></div>'+(result.length?'':'<div class="mp-empty">일치하는 템플릿이 없습니다. 검색 조건을 확인하세요.</div>')+'<div class="mp-pagination"><span>전체 '+result.length+'개 항목</span><span>1　 ·　20 / 쪽</span></div></section>'
    root.querySelector('#mp-ready').value = vm.ready
  }
  function renderDetail(){
    const r=current()
    const tabs=[['details','상세'],['zones','Zone'],['settings','설정'],['events','이벤트'],['comments','코멘트']]

    if(b.dataset.tab){vm.tab=b.dataset.tab;render();save()}
    if(b.dataset.dialog)openDialog(b.dataset.dialog)
    if(b.dataset.appearance){vm.appearance=b.dataset.appearance;root.querySelector('.mp-profile').open=false;applyAppearance();save()}
    if(b.dataset.action==='close-dialog')closeDialog()
    if(b.dataset.action==='refresh')say('현재 표시 범위의 상태를 다시 확인했습니다.')
    if(b.dataset.action==='create-vm')say('선택한 템플릿·Zone·아키텍처를 VM 생성 마법사에 전달합니다.')
  })
  root.addEventListener('change',event=>{
    if(event.target.id==='mp-ready'){vm.ready=event.target.value;render();save()}
    if(event.target.id==='mp-vnf-key'){const e=root.querySelector('#mp-vnf-value');e.type=/PASSWORD/.test(event.target.value)?'password':'text';e.value='';e.placeholder=e.type==='password'?'변경할 때만 입력':''}
  })
  root.addEventListener('submit',event=>{
    if(event.target.id==='mp-search-form'){event.preventDefault();vm.query=event.target.querySelector('input').value;render();save()}
    if(event.target.id==='mp-comment-form'){event.preventDefault();(vm.comments[current().id]??=[]).push(new FormData(event.target).get('comment'));render();say('코멘트를 저장했습니다.')}
  })
  root.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&event.target.tagName==='INPUT'&&event.target.type!=='checkbox'){const f=event.target.closest('form');if(f?.id==='mp-form'){event.preventDefault();if(f.reportValidity())handleModalSubmit(event);return}if(f?.id==='mp-search-form'){event.preventDefault();vm.query=f.querySelector('input').value;render();save();return}}
    if(event.target.getAttribute('role')==='tab'&&['ArrowRight','ArrowLeft'].includes(event.key)){event.preventDefault();const ts=Array.from(root.querySelectorAll('[role="tab"]'));const i=ts.indexOf(event.target);const next=ts[(i+(event.key==='ArrowRight'?1:ts.length-1))%ts.length];vm.tab=next.dataset.tab;render();root.querySelector('#'+next.id)?.focus();save()}
  })
  dialog.addEventListener('cancel',event=>{if(vm.busy)event.preventDefault()})
  const restored=window.openai?.widgetState
  if(restored?.modelContent){const x=restored.modelContent;if(['list','detail'].includes(x.view))vm.view=x.view;if(['auto','light','dark'].includes(x.appearance))vm.appearance=x.appearance;if(['details','zones','settings','vnf','events','comments'].includes(x.tab))vm.tab=x.tab}
  if(restored?.privateContent&&rows.some(r=>r.id===restored.privateContent.selected))vm.selected=restored.privateContent.selected
  window.addEventListener('openai:set_globals',event=>{const x=event.detail?.globals?.widgetState?.modelContent;if(x&&['auto','light','dark'].includes(x.appearance)){vm.appearance=x.appearance;applyAppearance()}})
  render()
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyAppearance()}});tweak.addSelect(vm,'appearance',{label:'표시 테마',options:[{label:'시스템',value:'auto'},{label:'라이트',value:'light'},{label:'다크',value:'dark'}],reference:'mold.appearance'})}
})()
</script>
